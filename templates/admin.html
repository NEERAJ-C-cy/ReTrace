{% extends "base.html" %}
{% block body %}
<h1>Historical media database</h1>

<section>
  <h2>Add an item</h2>
  <form class="admin-form" method="post" enctype="multipart/form-data">
    <label>Files <input id="historical-media" type="file" name="media" multiple required accept=".jpg,.jpeg,.png,.webp,.mp4,.mov,.avi,.mkv"></label>
    <p id="historical-file-count" class="muted"></p>
    <label>Title <input name="title" placeholder="Optional for bulk upload; filename used otherwise"></label>
    <label>Source name <input name="source_name"></label>
    <label>Source URL <input name="source_url" type="url"></label>
    <label>Published date <input name="published_date" placeholder="yyyy-mm-dd or yyyy-mm"></label>
    <label>Event date <input name="event_date" placeholder="yyyy-mm-dd"></label>
    <label>Location <input name="location"></label>
    <label>Country <input name="country"></label>
    <label>Description <textarea name="description" rows="2"></textarea></label>
    <label>Licence / usage note <input name="license"></label>
    <button type="submit">Add and fingerprint</button>
  </form>
</section>

<section>
  <h2>Existing items ({{ items|length }})</h2>
  <table>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Type</th>
      <th>Published</th>
      <th>Location</th>
    </tr>
    {% for i in items %}
    <tr>
      <td>{{ i.id }}</td>
      <td>{{ i.title }}</td>
      <td>{{ i.media_type }}</td>
      <td>{{ i.published_date }}</td>
      <td>{{ i.location_text }}</td>
    </tr>
    {% endfor %}
  </table>
</section>
{% endblock %}
